{% extends "base.html" %}

{% block content %}

<h3>Edit Profile</h3>

<form method="POST" enctype="multipart/form-data">

<div class="mb-3">

<label>Name</label>

<input type="text"
name="name"
value="{{ current_user.name }}"
class="form-control">

</div>


<div class="mb-3">

<label>Email</label>

<input type="email"
name="email"
value="{{ current_user.email }}"
class="form-control">

</div>


<div class="mb-3">

<label>Education</label>

<input type="text"
name="education"
value="{{ current_user.education }}"
class="form-control">

</div>


<div class="mb-3">

<label>Skills</label>

<input type="text"
name="skills"
value="{{ current_user.skills }}"
class="form-control">

</div>


<div class="mb-3">

<label>Upload New Resume</label>

<input type="file"
name="resume"
class="form-control">

</div>


{% if current_user.resume %}

<p>

Current Resume:

<a href="/static/resumes/{{ current_user.resume }}" target="_blank">

View Resume

</a>

</p>

{% endif %}


<button class="btn btn-success">

Save Changes

</button>

</form>

{% endblock %}
