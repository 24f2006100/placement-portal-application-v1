{% extends "base.html" %}

{% block content %}

<h3>Create a Drive</h3>

<form method="POST">

<div class="mb-3">

<label>Drive Name</label>

<input type="text"
name="title"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Job Description</label>

<textarea
name="description"
class="form-control">

</textarea>

</div>

<div class="mb-3">

<label>Eligibility Criteria</label>

<input type="text"
name="eligibility"
class="form-control">

</div>

<div class="mb-3">

<label>Required Skills</label>

<input type="text" name="skills" class="form-control">

</div>


<div class="mb-3">

<label>Experience</label>

<input type="text" name="experience" class="form-control">

</div>


<div class="mb-3">

<label>Salary Range</label>

<input type="text" name="salary" class="form-control">

</div>

<div class="mb-3">

<label>Application Deadline</label>

<input type="date"
name="deadline"
class="form-control">

</div>

<button class="btn btn-success">
Save
</button>

</form>

{% endblock %}
